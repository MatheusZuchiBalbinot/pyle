server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;

	# The bundle is JavaScript and JSON-like text: compressed, a fraction
	# of its size on the wire.
	gzip on;
	gzip_comp_level 6;
	gzip_min_length 1024;
	gzip_types text/css application/javascript application/json image/svg+xml;
	gzip_vary on;

	# Single-page app: every unknown path is the app's own route, not a 404.
	# `add_header` inside a location replaces the server's own, so every
	# location includes the security headers explicitly.
	location / {
		include /etc/nginx/snippets/security-headers.conf;
		try_files $uri $uri/ /index.html;
	}

	# Hashed asset filenames are immutable; index.html and the runtime
	# config must never be cached, or a deploy would serve the old bundle.
	location ~* \.(js|css|woff2?|png|svg|jpg|jpeg|gif|ico)$ {
		include /etc/nginx/snippets/security-headers.conf;
		expires 1y;
		add_header Cache-Control "public, immutable";
	}

	location = /index.html {
		include /etc/nginx/snippets/security-headers.conf;
		add_header Cache-Control "no-store";
	}

	location = /config.js {
		include /etc/nginx/snippets/security-headers.conf;
		add_header Cache-Control "no-store";
	}
}
